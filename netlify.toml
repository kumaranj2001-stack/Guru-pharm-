# Netlify deployment configuration — Guru Pharm
#
# Defaults below assume a Vite + React single-page app (build -> dist/).
#   * Create React App instead?  change publish = "build"
#   * Next.js instead?           remove the SPA redirect and use @netlify/plugin-nextjs
#   * App lives in a subfolder?  add  base = "path/to/app"  under [build]

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — THE fix for "404 on refresh / direct link".
# Every unknown path is served index.html so client-side routes such as
# /settings, /developer-settings and /branches work when opened directly.
# Keep this rule LAST so real files and API routes win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed filenames, so assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, otherwise users keep an old app shell
# that points at asset hashes which no longer exist (classic "white screen
# after deploy").
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
